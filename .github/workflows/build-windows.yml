name: Build Windows installer

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import netops_desk; print(netops_desk.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build app folder (used by the installer)
        run: >
          pyinstaller --noconfirm --clean --windowed --name NetOpsDesk
          --icon assets/icon.ico --add-data "assets;assets"
          --collect-data customtkinter run.py

      - name: Build portable single-file exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name NetOpsDesk-Portable
          --icon assets/icon.ico --add-data "assets;assets"
          --collect-data customtkinter --distpath dist-portable run.py

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          foreach ($exe in @("dist\NetOpsDesk\NetOpsDesk.exe", "dist-portable\NetOpsDesk-Portable.exe")) {
            $p = Start-Process $exe -ArgumentList "--selftest" -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "$exe self-test failed with exit code $($p.ExitCode)" }
            Write-Host "$exe self-test passed"
          }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\netops_desk.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Copy-Item "dist-portable\NetOpsDesk-Portable.exe" "installer\Output\NetOpsDesk-Portable-${{ steps.ver.outputs.version }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: NetOpsDesk-Windows-${{ steps.ver.outputs.version }}
          path: installer/Output/*.exe

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: NetOps Desk v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: installer/Output/*.exe
          body: |
            **NetOps Desk** - To-Do list + Notes for IT & network work.

            * `NetOpsDesk-Setup-${{ steps.ver.outputs.version }}.exe` - installer (Start menu + optional desktop shortcut, uninstaller, no admin needed)
            * `NetOpsDesk-Portable-${{ steps.ver.outputs.version }}.exe` - single file, runs without installing

            Windows may show a SmartScreen warning because the app is not code-signed: click **More info -> Run anyway**.
